name: Docs CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check site
        run: npm run typecheck
      - name: Build site
        # Report peak runner memory so build growth is visible before it fails.
        run: |
          (peak=0; while sleep 2; do used=$(free -m | awk '/^Mem:/ {print $3}'); if [ "$used" -gt "$peak" ]; then peak=$used; echo "$peak" > "$RUNNER_TEMP/peak-memory-mb"; fi; done) &
          npm run build
          echo "Peak runner memory in use during the build: $(cat "$RUNNER_TEMP/peak-memory-mb") MB of $(free -m | awk '/^Mem:/ {print $2}') MB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check search extraction
        run: npm run check:search
      - name: Check search engine metadata
        run: npm run check:seo
