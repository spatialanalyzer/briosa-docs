name: Docs CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check site
        run: npm run typecheck
      - name: Build site
        # Report the build's own peak memory (resident memory of its Node
        # processes) against the 10 GB budget in #94, and the runner's total.
        run: |
          (build_peak=0; runner_peak=0; while sleep 1; do
            build=$( (ps -C node -o rss= || true) | awk '{s += $1} END {print int(s / 1024)}')
            runner=$(free -m | awk '/^Mem:/ {print $3}')
            if [ "$build" -gt "$build_peak" ]; then build_peak=$build; echo "$build_peak" > "$RUNNER_TEMP/peak-build-mb"; fi
            if [ "$runner" -gt "$runner_peak" ]; then runner_peak=$runner; echo "$runner_peak" > "$RUNNER_TEMP/peak-runner-mb"; fi
          done) &
          npm run build
          build=$(cat "$RUNNER_TEMP/peak-build-mb")
          echo "Peak build memory (Node processes, resident): $build MB of a 10240 MB budget. Peak runner memory in use: $(cat "$RUNNER_TEMP/peak-runner-mb") MB of $(free -m | awk '/^Mem:/ {print $2}') MB." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$build" -gt 10240 ]; then echo "::warning title=Build memory::The build's Node processes peaked at $build MB, above the 10 GB budget in #94."; fi
      - name: Check search extraction
        run: npm run check:search
      - name: Check search engine metadata
        run: npm run check:seo
