name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        # Report the build's own peak memory (resident memory of its Node
        # processes) against the 10 GB budget in #94, and the runner's total.
        # A Node process name need not be "node", so match the executable in the
        # command line. Measurement never fails the build.
        run: |
          (build_peak=0; runner_peak=0; while sleep 1; do
            build=$(ps -eo rss=,args= | awk '{rss = $1; $1 = ""} $0 ~ /(^|[ \/])node( |$)/ {s += rss} END {print int(s / 1024)}')
            runner=$(free -m | awk '/^Mem:/ {print $3}')
            if [ "$build" -gt "$build_peak" ]; then build_peak=$build; echo "$build_peak" > "$RUNNER_TEMP/peak-build-mb"; fi
            if [ "$runner" -gt "$runner_peak" ]; then runner_peak=$runner; echo "$runner_peak" > "$RUNNER_TEMP/peak-runner-mb"; fi
          done) &
          npm run build
          build=$(cat "$RUNNER_TEMP/peak-build-mb" 2>/dev/null || echo 0)
          runner=$(cat "$RUNNER_TEMP/peak-runner-mb" 2>/dev/null || echo 0)
          echo "Peak build memory (Node processes, resident): $build MB of a 10240 MB budget. Peak runner memory in use: $runner MB of $(free -m | awk '/^Mem:/ {print $2}') MB." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$build" -eq 0 ]; then echo "::warning title=Build memory::No Node build process was sampled, so build memory was not measured."
          elif [ "$build" -gt 10240 ]; then echo "::warning title=Build memory::The build's Node processes peaked at $build MB, above the 10 GB budget in #94."; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
