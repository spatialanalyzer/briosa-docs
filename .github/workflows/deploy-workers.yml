name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check site
        run: npm run typecheck
      - name: Build site
        # Report the build's own peak memory (resident memory of its Node
        # processes) against the 10 GB budget in #94, and the runner's total.
        # Measurement never fails the build.
        run: |
          (build_peak=0; runner_peak=0; while sleep 1; do
            build=$(ps -eo rss=,args= | awk '{rss = $1; $1 = ""} $0 ~ /(^|[ \/])node( |$)/ {s += rss} END {print int(s / 1024)}')
            runner=$(free -m | awk '/^Mem:/ {print $3}')
            if [ "$build" -gt "$build_peak" ]; then build_peak=$build; echo "$build_peak" > "$RUNNER_TEMP/peak-build-mb"; fi
            if [ "$runner" -gt "$runner_peak" ]; then runner_peak=$runner; echo "$runner_peak" > "$RUNNER_TEMP/peak-runner-mb"; fi
          done) &
          npm run build
          build=$(cat "$RUNNER_TEMP/peak-build-mb" 2>/dev/null || echo 0)
          runner=$(cat "$RUNNER_TEMP/peak-runner-mb" 2>/dev/null || echo 0)
          echo "Peak build memory (Node processes, resident): $build MB of a 10240 MB budget. Peak runner memory in use: $runner MB of $(free -m | awk '/^Mem:/ {print $2}') MB." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$build" -eq 0 ]; then echo "::warning title=Build memory::No Node build process was sampled, so build memory was not measured."
          elif [ "$build" -gt 10240 ]; then echo "::warning title=Build memory::The build's Node processes peaked at $build MB, above the 10 GB budget in #94."; fi
      - name: Report asset manifest size
        # Report manifest file count, largest file, total bytes, and path collisions
        # against Cloudflare Workers Paid limits and project budgets (#146).
        run: node scripts/report-build-size.mjs build
      - name: Check search extraction
        run: npm run check:search
      - name: Check search engine metadata
        run: npm run check:seo
      - name: Package build archive
        run: tar -cf "$RUNNER_TEMP/site-build.tar" -C build .
      - name: Upload build archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: ${{ runner.temp }}/site-build.tar
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-workers
      url: https://briosa.dev
    steps:
      - name: Check out deployment config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Wrangler
        run: npm ci
      - name: Download build archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: ${{ runner.temp }}
      - name: Extract build archive
        run: |
          mkdir -p build
          tar -xf "$RUNNER_TEMP/site-build.tar" -C build
      - name: Publish to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --env=""
